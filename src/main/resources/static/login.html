<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>원 스텝 천 리 - 로그인</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #EAF0FF; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #101E3B; 
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(5, 12, 30, 0.08); 
            width: 350px;
            text-align: center;
        }

        h1 {
            color: #101E3B; 
            margin-bottom: 30px;
            font-size: 1.8em;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #D9E2F2; 
            border-radius: 8px;
            box-sizing: border-box;
            color: #101E3B;
            outline: none;
        }

        input:focus {
            border-color: #6E8CFF; 
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .login-btn {
            background-color: #2A3F7A; 
            color: white;
        }

        .signup-btn {
            background-color: #6E8CFF;
            color: white;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>‍원 스텝 천 리</h1>
        
        <!-- 서브 텍스트 색상 변경 -->
        <p style="color: #A0ABC0; margin-bottom: 25px;">ADHD를 위한 일정 관리 어플</p>
        
        <input type="text" id="userId" placeholder="아이디">
        <input type="password" id="password" placeholder="비밀번호">
        
        <!-- 닉네임 -->
        <input type="text" id="nickname" placeholder="닉네임 (가입 시에만 입력)" style="display: none;">
        
        <div class="btn-group">
            <button id="main_btn" class="login-btn" onclick="handleLogin()">로그인</button>
            <button id="toggle_btn" class="signup-btn" onclick="toggleMode()">회원가입으로 전환</button>
        </div>
    </div>

    <script>
        let isSignupMode = false;

        function toggleMode() {
            isSignupMode = !isSignupMode;
            const nickField = document.getElementById('nickname');
            const mainBtn = document.getElementById('main_btn');
            const toggleBtn = document.getElementById('toggle_btn');

            if (isSignupMode) {
                nickField.style.display = 'block';
                mainBtn.innerText = '가입하기';
                toggleBtn.innerText = '로그인으로 전환';
            } else {
                nickField.style.display = 'none';
                mainBtn.innerText = '로그인';
                toggleBtn.innerText = '회원가입으로 전환';
            }
        }

        async function handleLogin() {
            const userId = document.getElementById('userId').value;
            const pw = document.getElementById('password').value;
            const nick = document.getElementById('nickname').value;

            if (isSignupMode) {
                // 회원가입 요청
                const params = new URLSearchParams();
                params.append('userId', userId);
                params.append('password', pw);
                params.append('nickname', nick);
                const res = await fetch('/api/users/signup', { method: 'POST', body: params });
                alert(await res.text());
                toggleMode(); // 가입 후 로그인 모드로 변경
            } else {
                // 로그인 요청
                const params = new URLSearchParams();
                params.append('userId', userId);
                params.append('password', pw);
                const res = await fetch('/api/users/login', { method: 'POST', body: params });
                const result = await res.text();

                if (result === "로그인 성공") {
                    // 로그인 성공 시 메인 페이지로 이동
                    location.href = "main.html";
                } else {
                    alert(result);
                }
            }
        }
    </script>
</body>
</html>
